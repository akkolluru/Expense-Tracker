[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "expense-tracker"
version = "0.1.0"
description = "Expense Tracker application"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "httpx",
    "aiosqlite",
    "sqlalchemy[asyncio]",
    "alembic",
    "passlib[bcrypt]",
    "cryptography",
    "python-jose[cryptography]",
    "flet",
    "flet-charts",
    "apscheduler",
    "google-auth",
    "google-auth-oauthlib",
    "google-api-python-client",
    "pydantic",
    "pydantic-settings",
    "slowapi",
    "python-multipart",
    "pytest",
    "pytest-asyncio",
    "pytest-cov"
]
